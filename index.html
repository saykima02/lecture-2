<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>털뭉치 우주여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--ink:#ece6f5;--muted:rgba(236,230,245,.62);--wool:#f2a7b5;--mustard:#e8b84a;--mint:#7fe0b4;color-scheme:dark}
html,body{margin:0;background:#000;color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif}
#seq{position:relative;height:1200vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}
#back{position:absolute;left:-5%;top:-5%;width:110%;height:110%;filter:blur(40px) saturate(1.2)}
#front{position:absolute;inset:0;width:100%;height:100%;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 92%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 92%,transparent 100%)}
.counter{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  font:500 11px/1 "JetBrains Mono",ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(236,230,245,.12)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--wool),var(--mustard));transform-origin:left;transform:scaleX(0)}
.hint{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;
  font-size:13px;letter-spacing:.2em;color:var(--muted);transition:opacity .5s;pointer-events:none}
.hint::after{content:"";display:block;width:1px;height:28px;margin:10px auto 0;background:linear-gradient(var(--muted),transparent);animation:drop 1.6s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* 바이브 코딩 진행 패널 */
.vibe{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  width:min(340px,calc(100% - 32px));box-sizing:border-box;padding:14px 16px 16px;border-radius:14px;
  background:rgba(12,12,30,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(236,230,245,.14);opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;pointer-events:none}
.vibe.on{opacity:1;transform:none}
.vibe-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vibe-title{display:flex;align-items:center;gap:9px;font-family:"Jua",system-ui,sans-serif;font-size:19px;letter-spacing:.01em}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--mustard);box-shadow:0 0 0 0 rgba(232,184,74,.6);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 9px rgba(232,184,74,0)}}
.pct{font:500 13px/1 "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--mustard);font-variant-numeric:tabular-nums}
.code{margin:12px 0 12px;display:grid;gap:5px;font:500 12.5px/1.5 "JetBrains Mono",ui-monospace,Menlo,monospace;color:var(--muted);min-height:6.2em;align-content:end}
.code div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code .ok{color:var(--mint)}
.code .now{color:var(--ink)}
.code .now::after{content:"▍";margin-left:3px;color:var(--mustard);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.meter{height:4px;border-radius:4px;background:rgba(236,230,245,.16);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--wool),var(--mustard));transform-origin:left;transform:scaleX(0)}
@media (prefers-reduced-motion:reduce){.hint::after,.pulse,.code .now::after{animation:none}}
</style>
</head>
<body>
<section id="seq" aria-label="털뭉치 우주여행 스크롤 영상">
  <div class="stage" id="stage">
    <canvas id="back" aria-hidden="true"></canvas>
    <canvas id="front" role="img" aria-label="털뭉치 캐릭터가 행성에서 뛰어올라 우주를 날아 노란 행성 '강의 준비 중'에 도착하는 장면"></canvas>
    <div class="counter"><span id="fnum">001</span> / 240</div>
    <div class="hint" id="hint">SCROLL</div>
    <div class="vibe" id="vibe" aria-live="off">
      <div class="vibe-top">
        <div class="vibe-title"><span class="pulse"></span>바이브 코딩 진행 중</div>
        <div class="pct" id="pct">0%</div>
      </div>
      <div class="code" id="code"></div>
      <div class="meter"><i id="meter"></i></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(() => {
const W = 800, H = 450, TOTAL = 240;
const $ = id => document.getElementById(id);
const stage = $('stage'), front = $('front'), back = $('back'), seq = $('seq');
const fctx = front.getContext('2d'), bctx = back.getContext('2d');
const off = document.createElement('canvas'), c = off.getContext('2d');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const smoother = x => { x = clamp(x,0,1); return x*x*x*(x*(x*6-15)+10); };
const eo = p => 1 - Math.pow(1-p, 3);

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* 펠트 질감 */
const pc = document.createElement('canvas'); pc.width = pc.height = 160;
{const x=pc.getContext('2d'), r=rng(7);
 for(let i=0;i<1100;i++){const px=r()*160,py=r()*160,a=r()*Math.PI*2,l=2+r()*7;
  x.strokeStyle=r()<.5?'rgba(255,255,255,.16)':'rgba(30,10,40,.14)';x.lineWidth=.8+r()*.7;
  x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+Math.cos(a+1)*l*.5,py+Math.sin(a+1)*l*.5,px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();}}
let pattern = c.createPattern(pc,'repeat');

function ell(cx,cy,rx,ry,rot=0){const p=new Path2D();p.ellipse(cx,cy,rx,ry,rot,0,Math.PI*2);return p}
function felt(path,color,box,fuzz){
  c.fillStyle=color;c.fill(path);
  c.save();c.clip(path);c.fillStyle=pattern;c.fillRect(box[0],box[1],box[2],box[3]);c.restore();
  if(fuzz){const[cx,cy,rx,ry,seed,n]=fuzz,r=rng(seed);
    c.strokeStyle=color;c.lineWidth=1.4;const ga=c.globalAlpha;c.globalAlpha=ga*.75;
    c.beginPath();
    for(let k=0;k<n;k++){const a=(k/n)*Math.PI*2+r()*.08,l=1.5+r()*4.5,ex=cx+Math.cos(a)*rx,ey=cy+Math.sin(a)*ry,j=r()*.6-.3;
      c.moveTo(ex-Math.cos(a)*2,ey-Math.sin(a)*2);c.lineTo(ex+Math.cos(a+j)*l,ey+Math.sin(a+j)*l);}
    c.stroke();c.globalAlpha=ga;}
}
function feltEll(cx,cy,rx,ry,color,seed,n=70){felt(ell(cx,cy,rx,ry),color,[cx-rx-4,cy-ry-4,rx*2+8,ry*2+8],[cx,cy,rx,ry,seed,n])}

/* 장면 데이터 */
const sr=rng(42), stars=Array.from({length:280},()=>({x:sr()*W,y:sr()*(H+40),d:.15+sr()*.85,s:.6+sr()*1.6}));
const cr=rng(9), craters=Array.from({length:14},()=>({a:-Math.PI/2+(cr()-.5)*1.1,r:.55+cr()*.4,s:14+cr()*34}));
const nebulae=[{x:.25,y:.3,r:260,col:'120,80,200'},{x:.8,y:.7,r:300,col:'230,110,150'},{x:.4,y:1.1,r:280,col:'70,140,190'}];
const gr=rng(77), GL=['{ }','</>','=>','();','[ ]','//','&&','#','fn','</','++','0 1'];
const glyphs=Array.from({length:34},()=>({x:20+gr()*(W-40),y:gr()*(H+60),d:.25+gr()*.75,ch:GL[Math.floor(gr()*GL.length)]}));

/* 카메라: 출발은 빠르게, 도착은 부드럽게 감속 */
const CAM=5200, B=.17;
const camAt = p => CAM * smoother(Math.pow(p,.82));
const speedAt = p => clamp((camAt(clamp(p+.012,0,1)) - camAt(clamp(p-.012,0,1))) / (.024*CAM*1.55), 0, 1);

  feltEll(x,cy+ry*.32,rx*.55,ry*.45,'#fbe3d6',22,60);
  c.fillStyle='rgba(225,90,120,.42)';c.beginPath();c.arc(x-30,cy+2,9,0,7);c.arc(x+30,cy+2,9,0,7);c.fill();
  c.fillStyle='#2b2140';c.beginPath();c.ellipse(x-17,cy-10,6,8.5,0,0,7);c.ellipse(x+17,cy-10,6,8.5,0,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(x-15,cy-13,2.2,0,7);c.arc(x+19,cy-13,2.2,0,7);c.fill();
  c.strokeStyle='#2b2140';c.lineWidth=2.4;c.beginPath();c.arc(x,cy+3,6,.2*Math.PI,.8*Math.PI);c.stroke();
  c.restore();
}

/* 마지막 노란 행성: 점점 커지며 중앙에 도착 */
function drawFinal(p){
  const q=clamp((p-.42)/.58,0,1); if(q<=0) return;
  const e=smoother(q), y=-230+e*(H*.45+230), r=44+e*112, x=W/2;
  const gl=c.createRadialGradient(x,y,r*.5,x,y,r*2.5);
  gl.addColorStop(0,`rgba(255,214,120,${.6*e})`);gl.addColorStop(1,'rgba(255,214,120,0)');
  c.fillStyle=gl;c.fillRect(0,0,W,H);
  feltEll(x,y,r,r,'#f3c64f',61,220);
  c.fillStyle='rgba(176,118,30,.3)';
  [[-.42,-.3,.17],[.38,-.12,.12],[-.15,.5,.14],[.5,.42,.09]].forEach(([a,b,s])=>{c.beginPath();c.ellipse(x+a*r,y+b*r,s*r,s*r*.8,0,0,7);c.fill();});
  c.save();c.setLineDash([7,6]);c.strokeStyle='rgba(120,78,16,.55)';c.lineWidth=2.2;c.beginPath();c.arc(x,y,r*.88,0,7);c.stroke();c.restore();
  const ta=clamp((p-.84)/.1,0,1);
  if(ta>0){
    c.save();c.globalAlpha=ta;c.textAlign='center';c.textBaseline='middle';
    c.font=`${Math.round(r*.25)}px Jua,"Apple SD Gothic Neo","Noto Sans KR",sans-serif`;
    c.lineWidth=3;c.strokeStyle='rgba(255,246,214,.55)';c.lineJoin='round';c.strokeText('강의 준비 중',x,y+2);
    c.fillStyle='#5a3a0e';c.fillText('강의 준비 중',x,y+2);
    c.restore();
  }
}

/* t: 0~1 연속값. 프레임 경계 없이 스크롤마다 다시 그림 */
function render(t){
  const groundY=H*.78;
  let cam=0,v=0,cx=W/2,cyy=groundY,squash=0,armsUp=false,tilt=0,h=0,p=0,sc=1;
  if(t<B){
    const u=t/B,hi=Math.min(1,Math.floor(u*2)),l=u*2-hi,hs=[40,86];
    h=Math.sin(Math.PI*l)*hs[hi];cyy=groundY-h;
    const edge=Math.min(l,1-l);if(edge<.14)squash=(1-edge/.14)*.7;
    armsUp=h>hs[hi]*.5;
  }else{
    p=(t-B)/(1-B);cam=camAt(p);v=speedAt(p);
    const lift=eo(clamp(p*3.2,0,1)), land=smoother((p-.72)/.28);
    cyy=groundY+(H*.56-groundY)*lift+(H*.97-H*.56)*land;
    const amp=Math.min(1,p*4)*(1-land*.85);
    cx=W/2+Math.sin(p*13)*20*amp;
    tilt=Math.cos(p*13)*.1*amp;
    squash=-.45*(1-clamp(p*8,0,1))-.1*v*(1-land);
    armsUp=true;sc=1-.32*land;
  }
  c.save();
  if(p>0&&p<.12){const s=3.2*(1-p/.12)*v;c.translate(Math.sin(t*900)*s,Math.cos(t*700)*s);}
  // 하늘
  const k=clamp(cam/1300,0,1);
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${18-8*k},${16-8*k},${48-24*k})`);g.addColorStop(1,`rgb(${62-50*k},${40-30*k},${92-62*k})`);
  c.fillStyle=g;c.fillRect(-10,-10,W+20,H+20);
  // 성운
  c.globalCompositeOperation='lighter';
  for(const n of nebulae){const ny=((n.y*H+cam*.08)%(H*1.6))-H*.3;
    const rg=c.createRadialGradient(n.x*W,ny,0,n.x*W,ny,n.r);
    rg.addColorStop(0,`rgba(${n.col},${.17*k})`);rg.addColorStop(1,`rgba(${n.col},0)`);
    c.fillStyle=rg;c.fillRect(0,0,W,H);}
  c.globalCompositeOperation='source-over';
  // 별: 속도에 따라 길어지는 줄
  c.fillStyle=c.strokeStyle='#fff5e0';c.lineCap='round';
  for(const s of stars){
    const y=((s.y+cam*s.d*.7)%(H+40)+(H+40))%(H+40)-20, len=v*s.d*50;
    c.globalAlpha=.3+s.d*.65;
    if(len>1.5){c.lineWidth=s.s*.85;c.beginPath();c.moveTo(s.x,y);c.lineTo(s.x,y-len);c.stroke();}
    else{c.beginPath();c.arc(s.x,y,s.s*.7,0,7);c.fill();}
  }
  // 코드 기호가 아래로 스쳐 지나감 (바이브 코딩)
  c.textAlign='center';c.textBaseline='middle';c.fillStyle='#bfe9ff';
  const ga=clamp(cam/500,0,1);
  if(ga>0)for(const q of glyphs){
    const y=((q.y+cam*q.d*.95)%(H+60)+(H+60))%(H+60)-30;
    c.globalAlpha=(.1+.26*q.d)*ga;
    c.font=`${Math.round(10+q.d*14)}px "JetBrains Mono",ui-monospace,monospace`;
    c.fillText(q.ch,q.x,y);
  }
  c.globalAlpha=1;
  // 지나가는 천체
  const moonY=-300+cam*.4;
  if(moonY>-80&&moonY<H+80){feltEll(W*.8,moonY,58,58,'#f4ead2',31,130);
    c.fillStyle='rgba(180,160,120,.35)';c.beginPath();c.arc(W*.8-17,moonY-11,11,0,7);c.arc(W*.8+19,moonY+15,7,0,7);c.fill();}
  const ringY=-160+(cam-1500)*.45;
  if(ringY>-120&&ringY<H+120){
    c.strokeStyle='#e8b84a';c.lineWidth=7;c.globalAlpha=.9;
    c.beginPath();c.ellipse(W*.17,ringY,120,26,-.25,Math.PI,Math.PI*2);c.stroke();
    feltEll(W*.17,ringY,66,66,'#9b8ed6',41,140);
    c.beginPath();c.ellipse(W*.17,ringY,120,26,-.25,0,Math.PI);c.stroke();c.globalAlpha=1;}
  const pinkY=-80+(cam-2700)*.7;
  if(pinkY>-50&&pinkY<H+50){feltEll(W*.86,pinkY,32,32,'#e8949f',51,80);}
  drawFinal(p);
  // 출발 행성
  const R=820,pcx=W/2,pcy=groundY+R+cam;
  if(pcy-R<H+20){
    felt(ell(pcx,pcy,R,R),'#5aa39a',[0,Math.max(0,pcy-R-6),W,H]);
    for(const q of craters){const x=pcx+Math.cos(q.a)*R*q.r,y=pcy+Math.sin(q.a)*R*q.r;
      if(y<H+40){c.fillStyle='rgba(30,70,72,.38)';c.beginPath();c.ellipse(x,y,q.s,q.s*.42,0,0,7);c.fill();}}
    [[-.18,'#e8b84a'],[.22,'#f2a7b5'],[.34,'#e8b84a']].forEach(([o,col],j)=>{
      const a=-Math.PI/2+o,x=pcx+Math.cos(a)*R,y=pcy+Math.sin(a)*R;
      c.strokeStyle='#2f6b62';c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x,y-22);c.stroke();
      feltEll(x,y-26,8,8,col,60+j,30);});
  }
  if(t<B){const sw=48*(1-h/130);c.fillStyle='rgba(20,40,45,.35)';c.beginPath();c.ellipse(W/2,groundY+2,sw,sw*.22,0,0,7);c.fill();}
  // 비행 꼬리 (속도에 비례, 도착하면 사라짐)
  if(p>0&&v>.03){const f=Math.min(1,p*5)*Math.min(1,v*1.6);
    for(let j=10;j>=1;j--){c.globalAlpha=(1-j/11)*.85*f;
      const wob=Math.sin(p*13-j*.35)*20*Math.min(1,p*4);
      feltEll(cx+wob*.0+Math.sin(p*13-j*.35)*14*sc,cyy+6+j*(8+v*13)*sc,(15-j)*1.1*sc,(15-j)*1.1*sc,j%2?'#bfe9ff':'#8fd0f5',80+j,22);}
    c.globalAlpha=1;}
  drawChar(cx,cyy,squash,armsUp,tilt,sc,p>0?Math.min(1,p*6)*(1-smoother((p-.8)/.2)):0);
  c.restore();
}

/* 캔버스 2장: 앞 contain(선명) / 뒤 cover 110%(블러) */
let scale=1, cur=0, lastPainted=-1;
function fit(W0,H0,Wc,Hc,mode){const ir=W0/H0,cr2=Wc/Hc;let w,h;
  if((mode==='cover')===(ir<cr2)){w=Wc;h=Wc/ir}else{h=Hc;w=Hc*ir}return[(Wc-w)/2,(Hc-h)/2,w,h]}
function size(){
  const w=stage.clientWidth,h=stage.clientHeight,dpr=Math.min(devicePixelRatio||1,2);
  front.width=Math.round(w*dpr);front.height=Math.round(h*dpr);
  back.width=Math.max(1,Math.round(w*1.1/4));back.height=Math.max(1,Math.round(h*1.1/4));
  const cw=fit(W,H,front.width,front.height,'contain')[2];
  scale=clamp(cw/W,1,2);off.width=Math.round(W*scale);off.height=Math.round(H*scale);
  pattern=c.createPattern(pc,'repeat');
  lastPainted=-1;paint(cur);
}

/* 바이브 코딩 패널 */
const LINES=['> 스크롤 따라 날아가는 사이트 만들어줘','캔버스 2장 겹치기','별 · 행성 패럴랙스','부드러운 스크롤 연결','속도감 효과 추가','마지막 행성 배치','배포 준비'];
const vibe=$('vibe'),codeEl=$('code'),pctEl=$('pct'),meter=$('meter');
let lastK=-1,lastPct=-1;
function hud(t,p){
  vibe.classList.toggle('on',t>B*.9);
  const hp=clamp(p/.92,0,1), pct=Math.round(hp*100);
  if(pct!==lastPct){lastPct=pct;pctEl.textContent=pct+'%';}
  meter.style.transform=`scaleX(${hp})`;
  const k=Math.min(LINES.length,Math.floor(hp*LINES.length)+1);
  const key=k+(hp>=1?100:0);
  if(key!==lastK){lastK=key;
    const shown=LINES.slice(Math.max(0,k-4),k);
    codeEl.innerHTML=shown.map((s,i)=>{
      const last=i===shown.length-1, done=!last||hp>=1;
      return `<div class="${done?'ok':'now'}">${done&&!/^>/.test(s)?'✓ ':''}${s.replace(/</g,'&lt;')}</div>`}).join('');
  }
}

const fnum=$('fnum'),bar=$('bar'),hint=$('hint');
function paint(t){
  cur=t;lastPainted=t;
  c.setTransform(scale,0,0,scale,0,0);render(t);
  fctx.fillStyle='#000';fctx.fillRect(0,0,front.width,front.height);
  fctx.drawImage(off,...fit(off.width,off.height,front.width,front.height,'contain'));
  bctx.drawImage(off,...fit(off.width,off.height,back.width,back.height,'cover'));
  fnum.textContent=String(Math.round(t*(TOTAL-1))+1).padStart(3,'0');
  bar.style.transform=`scaleX(${t})`;
  hint.style.opacity=t>.015?0:1;
  hud(t,Math.max(0,(t-B)/(1-B)));
}

/* 스크롤: Lenis 관성 + 추가 감쇠로 한 번 더 부드럽게 */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lenis=(!reduce&&window.Lenis)?new Lenis({lerp:.09,wheelMultiplier:.9}):null;
const target=()=>clamp(scrollY/Math.max(1,seq.offsetHeight-innerHeight),0,1);
let shown=target(),prev=performance.now();
function tick(now){
  if(lenis)lenis.raf(now);
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  const tg=target();
  shown=reduce?tg:shown+(tg-shown)*(1-Math.exp(-dt*9));
  if(Math.abs(tg-shown)<.00004)shown=tg;
  if(shown!==lastPainted)paint(shown);
  requestAnimationFrame(tick);
}
addEventListener('resize',size);
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('40px Jua','강의 준비 중'),document.fonts.load('12px "JetBrains Mono"')]).then(()=>{lastPainted=-1}).catch(()=>{});}
size();
requestAnimationFrame(tick);
})();
</script>
